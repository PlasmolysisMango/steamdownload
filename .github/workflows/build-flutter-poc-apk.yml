name: Build Flutter PoC Android APK

on:
  workflow_dispatch:
    inputs:
      config:
        description: "构建配置"
        type: choice
        options: [Release, Debug]
        default: Debug
      release_tag:
        description: "发布到 Release 的 tag 名（留空=不发布）"
        type: string
        default: ""
  push:
    branches: [develop_flutter]
  pull_request:
    branches: [develop_flutter]
    paths:
      - "src/**"
      - "external/**"
      - "build.mjs"
      - "Makefile"
      - ".github/workflows/build-flutter-poc-apk.yml"

# 同一分支/PR 只保留最新一次 Flutter PoC 构建
concurrency:
  group: build-flutter-poc-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-flutter-poc-apk:
    runs-on: ubuntu-latest
    env:
      CONFIG: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'Debug' || (inputs.config || 'Debug') }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      SKIP_SOURCE_PROBE: "1"
    outputs:
      config: ${{ steps.resolve-config.outputs.config }}
      artifact-name: ${{ steps.resolve-config.outputs.artifact-name }}
      apk-name: ${{ steps.resolve-config.outputs.apk-name }}

    steps:
      - name: Resolve config
        id: resolve-config
        run: |
          echo "config=${{ env.CONFIG }}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=steamdl-flutter-poc-apk-${{ env.CONFIG }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "apk-name=SteamDl-FlutterPoC-${{ env.CONFIG }}.apk" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/SteamDl.Web/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .tools/nuget
          key: ${{ runner.os }}-nuget-flutter-poc-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-flutter-poc-
            ${{ runner.os }}-nuget-

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            src/SteamDl.FlutterPoc/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('src/SteamDl.FlutterPoc/lib/main.dart') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Prepare signing keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .tools/keystore
          python3 - <<'PY'
          import base64
          import os
          import sys

          raw = (os.environ.get('ANDROID_KEYSTORE_BASE64') or '').strip()
          if raw.startswith('ANDROID_KEYSTORE_BASE64=') or '\nANDROID_KEYSTORE_BASE64=' in raw:
              print('::error::ANDROID_KEYSTORE_BASE64 Secret 填写错误：Secret Name 应为 ANDROID_KEYSTORE_BASE64，Secret Value 只能填写等号右侧的 base64 内容，不要包含 ANDROID_KEYSTORE_BASE64= 前缀。')
              sys.exit(1)
          raw = raw.strip('"\'')
          compact = ''.join(raw.split())
          if not compact:
              print('::error::ANDROID_KEYSTORE_BASE64 Secret 为空')
              sys.exit(1)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception:
              print('::error::ANDROID_KEYSTORE_BASE64 不是有效 base64。请只填写 github-actions-secrets.env 中 ANDROID_KEYSTORE_BASE64= 右侧的值；不要包含空格或截断。')
              sys.exit(1)
          if len(data) < 512:
              print('::error::解码后的 keystore 过小，Secret 可能被截断或复制错误')
              sys.exit(1)
          with open('.tools/keystore/steamdl-release.keystore', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          PY

      - name: Build Flutter PoC APK
        env:
          ANDROID_KEYSTORE: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && format('{0}/.tools/keystore/steamdl-release.keystore', github.workspace) || '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          node build.mjs build-apk \
            --config=${{ env.CONFIG }} \
            --enable-flutter-poc=true \
            --nuget-source=https://api.nuget.org/v3/index.json \
            --npm-registry=https://registry.npmjs.org \
            --skip-probe=true

      - name: Prepare direct APK file
        run: |
          mkdir -p artifacts/direct
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import sys

          apk_name = '${{ steps.resolve-config.outputs.apk-name }}'
          apks = sorted(glob.glob('artifacts/apk/*.apk'))
          signed = [p for p in apks if p.lower().endswith('-signed.apk')]
          selected = signed[0] if signed else (apks[0] if apks else None)
          if not selected:
              print('::error::未找到 APK 产物')
              sys.exit(1)
          target = os.path.join('artifacts', 'direct', apk_name)
          shutil.copyfile(selected, target)
          print(f'Direct APK: {target}')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve-config.outputs.artifact-name }}
          path: artifacts/direct/${{ steps.resolve-config.outputs.apk-name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: build-flutter-poc-apk
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-flutter-poc-apk.outputs.artifact-name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          CONFIG: ${{ needs.build-flutter-poc-apk.outputs.config }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t apks < <(find dist -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::未找到可发布的 APK 文件"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${apks[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${apks[@]}" \
              --title "$TAG" \
              --notes "Flutter PoC 自动构建（CONFIG=$CONFIG, commit=$SHA）" \
              --repo "$REPO"
          fi
