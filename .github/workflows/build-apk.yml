name: Build SteamDl (MAUI + .NET engine)

on:
  workflow_dispatch:
    inputs:
      config:
        description: "构建配置"
        type: choice
        options: [Release, Debug]
        default: Release
      release_tag:
        description: "发布到 Release 的 tag 名（留空=不发布）"
        type: string
        default: ""
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "external/**"
      - "build.mjs"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CONFIG: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'develop')) && 'Debug' || (inputs.config || 'Release') }}

jobs:
  build-engine-bionic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-bionic-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-bionic-

      - name: Publish engine (linux-bionic-arm64)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet publish src/SteamDl.Server/SteamDl.Server.csproj \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSelfContained=true \
            -o artifacts/engine-bionic
          test -f artifacts/engine-bionic/steamdl-engine
          test -f artifacts/engine-bionic/libhostfxr.so
          test -f artifacts/engine-bionic/libhostpolicy.so
          test -f artifacts/engine-bionic/libcoreclr.so
          chmod +x artifacts/engine-bionic/steamdl-engine
          ls -lh artifacts/engine-bionic

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-bionic-${{ github.sha }}
          path: artifacts/engine-bionic
          if-no-files-found: error
          retention-days: 3

  build-apk:
    runs-on: ubuntu-latest
    needs: build-engine-bionic
    outputs:
      config: ${{ steps.resolve-config.outputs.config }}
      artifact-name: ${{ steps.resolve-config.outputs.artifact-name }}
      apk-name: ${{ steps.resolve-config.outputs.apk-name }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Resolve config
        id: resolve-config
        run: |
          echo "config=${{ env.CONFIG }}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=steamdl-apk-${{ env.CONFIG }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "apk-name=SteamDl-${{ env.CONFIG }}.apk" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-bionic-${{ github.sha }}
          path: engine-download

      - name: Assemble engine bundle (asset zip) + CA cert
        run: |
          set -euo pipefail
          ENGINE_DIR=engine-download
          chmod +x "$ENGINE_DIR/steamdl-engine"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/KDAB/android_openssl/master/ssl_3/arm64-v8a/libssl_3.so \
            -o "$ENGINE_DIR/libssl.so.3"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/KDAB/android_openssl/master/ssl_3/arm64-v8a/libcrypto_3.so \
            -o "$ENGINE_DIR/libcrypto.so.3"
          curl -fsSL --retry 3 \
            https://www.nuget.org/api/v2/package/SQLitePCLRaw.lib.e_sqlite3.android/2.1.10 \
            -o /tmp/sqlite-android.nupkg
          python3 - <<PY
          import zipfile
          nupkg = '/tmp/sqlite-android.nupkg'
          aar = '/tmp/SQLitePCLRaw.lib.e_sqlite3.android.aar'
          with zipfile.ZipFile(nupkg) as z:
              data = z.read('lib/net6.0-android31.0/SQLitePCLRaw.lib.e_sqlite3.android.aar')
          with open(aar, 'wb') as f:
              f.write(data)
          with zipfile.ZipFile(aar) as z:
              data = z.read('jni/arm64-v8a/libe_sqlite3.so')
          with open('$ENGINE_DIR/libe_sqlite3.so', 'wb') as f:
              f.write(data)
          PY
          mkdir -p src/SteamDl.Maui/Assets
          python3 - <<PY
          import os
          import zipfile
          src = '$ENGINE_DIR'
          out = 'src/SteamDl.Maui/Assets/engine-bionic.zip'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(os.listdir(src)):
                  path = os.path.join(src, name)
                  if os.path.isfile(path):
                      z.write(path, name)
          PY
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem \
            -o src/SteamDl.Maui/Assets/cacert.pem
          ls -lh src/SteamDl.Maui/Assets

      - name: Prepare signing keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .tools/keystore
          python3 - <<'PY'
          import base64
          import os
          import sys
          raw = (os.environ.get('ANDROID_KEYSTORE_BASE64') or '').strip().strip('"\'')
          compact = ''.join(raw.split())
          if not compact:
              print('::error::ANDROID_KEYSTORE_BASE64 Secret 为空')
              sys.exit(1)
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception:
              print('::error::ANDROID_KEYSTORE_BASE64 不是有效 base64。')
              sys.exit(1)
          if len(data) < 512:
              print('::error::解码后的 keystore 过小，Secret 可能被截断')
              sys.exit(1)
          with open('.tools/keystore/steamdl-release.keystore', 'wb') as f:
              f.write(data)
          print(f'Keystore restored: {len(data)} bytes')
          PY

      - name: Build MAUI APK
        env:
          ANDROID_KEYSTORE: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && format('{0}/.tools/keystore/steamdl-release.keystore', github.workspace) || '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          set -euo pipefail
          args=(publish src/SteamDl.Maui/SteamDl.Maui.csproj -f net9.0-android -c "${{ env.CONFIG }}" -r android-arm64 -p:AndroidPackageFormat=apk -p:AndroidCreatePackagePerAbi=false)
          if [ "${HAS_RELEASE_KEYSTORE}" = "true" ] && [ "${{ env.CONFIG }}" = "Release" ]; then
            args+=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" -p:AndroidSigningKeyPass="$ANDROID_KEY_PASS" -p:AndroidSigningStorePass="$ANDROID_STORE_PASS")
          fi
          dotnet "${args[@]}" 2>&1 | tee /tmp/apk-build.log
          apk=$(find src/SteamDl.Maui/bin/${{ env.CONFIG }}/net9.0-android -name '*.apk' | head -n 1)
          test -n "$apk"
          mkdir -p artifacts/direct
          cp "$apk" "artifacts/direct/${{ steps.resolve-config.outputs.apk-name }}"
          ls -lh artifacts/direct

      - name: Upload APK build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log-${{ github.sha }}
          path: /tmp/apk-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve-config.outputs.artifact-name }}
          path: artifacts/direct/${{ steps.resolve-config.outputs.apk-name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-windows:
    runs-on: windows-2022
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
      zip-name: ${{ steps.meta.outputs.zip-name }}
    steps:
      - name: Resolve meta
        id: meta
        shell: bash
        run: |
          echo "artifact-name=steamdl-windows-${{ env.CONFIG }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "zip-name=SteamDl-Windows-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Publish engine (win-x64)
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet publish src/SteamDl.Server/SteamDl.Server.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o artifacts/engine-win
          $sqlite = Join-Path $env:USERPROFILE ".nuget\packages\sqlitepclraw.lib.e_sqlite3\2.1.10\runtimes\win-x64\native\e_sqlite3.dll"
          if (!(Test-Path $sqlite)) { throw "Missing SQLite native library: $sqlite" }
          Copy-Item $sqlite artifacts/engine-win/e_sqlite3.dll -Force
          Get-ChildItem artifacts/engine-win | Format-Table Name,Length

      - name: Publish MAUI Windows app
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet publish src/SteamDl.Maui/SteamDl.Maui.csproj `
            -f net9.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            -p:WindowsPackageType=None `
            -p:SelfContained=true `
            -o artifacts/maui-win

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/windows/SteamDl
          mkdir -p "$OUT/engine"
          cp -r artifacts/maui-win/. "$OUT/"
          cp -r artifacts/engine-win/. "$OUT/engine/"
          cd artifacts/windows
          7z a "../${{ steps.meta.outputs.zip-name }}" SteamDl

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: artifacts/${{ steps.meta.outputs.zip-name }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact-name }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          CONFIG: ${{ needs.build-apk.outputs.config }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.apk' -o -name '*.zip' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::未找到可发布的产物"
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --notes "自动构建（CONFIG=$CONFIG, commit=$SHA）" \
              --repo "$REPO"
          fi
