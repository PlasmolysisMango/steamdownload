name: steamdl_app
description: SteamDl - Steam depot downloader with native Flutter UI and .NET engine sidecar.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

# UI 状态管理使用 provider 分层；collection 用于库/任务集合处理。
dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  provider: ^6.1.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
