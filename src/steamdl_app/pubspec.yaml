name: steamdl_app
description: SteamDl - Steam depot downloader with native Flutter UI and .NET engine sidecar.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

# 刻意零第三方依赖:网络用 dart:io,状态管理用 ChangeNotifier,
# 平台能力(前台服务/SAF/目录)走 MethodChannel,保证 CI 构建确定性。
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
